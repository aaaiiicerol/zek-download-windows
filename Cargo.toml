[package]
name = "zek-download"
version = "1.1.0"
edition = "2021"
description = "Baixador de vídeos e músicas para Windows, com o yt-dlp como motor"
license = "MIT"
authors = ["aaaiiicerol"]
repository = "https://github.com/aaaiiicerol/zek-download-windows"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["glow", "default_fonts"] }
ureq = { version = "2.10", default-features = false, features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "5"
rfd = "0.14"
arboard = { version = "3", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
